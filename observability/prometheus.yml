global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # DNS service discovery picks up every replica of the scaled services.
  - job_name: advance-rag-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 8000

  - job_name: advance-rag-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
