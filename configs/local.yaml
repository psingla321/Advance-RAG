# Fully local and private: Ollama + sentence-transformers, no data leaves the machine.
# Generated starting point - edit freely.

name: local
description: 'Fully local and private: Ollama + sentence-transformers, no data leaves
  the machine.'
llm:
  type: ollama
  model: llama3.1
embedder:
  type: cached
  inner:
    type: sentence_transformers
    model: BAAI/bge-small-en-v1.5
vectorstore:
  type: memory
  persist_path: .nexus_cache/store.json
loader:
  type: auto
chunker:
  type: semantic
transform:
  type: identity
retriever:
  type: hybrid_rrf
reranker:
  type: cross_encoder
compressor:
  type: submodular
generator:
  type: stuff
top_k: 30
top_n: 8
context_token_budget: 3000
namespace: default
min_score: 0.0
abstain_when_empty: true
guardrails: true
cache: false
cache_ttl_seconds: 3600
verify: false
verify_threshold: 0.8
system_prompt: null
metadata: {}
