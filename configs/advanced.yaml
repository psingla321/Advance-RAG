name: advanced
description: 'Everything on: query expansion, hybrid retrieval, cross-encoder rerank,
  self-critique.'
llm:
  type: mock
embedder:
  type: hash
  dim: 512
vectorstore:
  type: memory
loader:
  type: auto
chunker:
  type: parent_child
  parent_tokens: 1200
  child_tokens: 220
transform:
  type: chain
  steps:
  - type: rewrite
  - type: multi_query
    n: 3
