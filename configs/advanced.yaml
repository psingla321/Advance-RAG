    top_n: 20
  - reranker:
      type: cross_encoder
compressor:
  type: lost_in_middle
generator:
  type: self_rag
  inner:
    type: citation_strict
top_k: 40
top_n: 8
context_token_budget: 3000
namespace: default
min_score: 0.0
abstain_when_empty: true
guardrails: true
cache: false
cache_ttl_seconds: 3600
verify: true
verify_threshold: 0.8
system_prompt: null
metadata: {}
